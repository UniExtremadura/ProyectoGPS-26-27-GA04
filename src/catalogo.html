<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centinela — Catálogo de Piezas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🛡️ Centinela</h1>
        <nav id="navMenu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html" class="active">Catálogo</a>
            <a href="solicitar.html">Solicitar Pieza</a>
            <a href="mis-solicitudes.html">Mis Solicitudes</a>
            <a href="almacen.html">Almacén</a>
        </nav>
    </header>
    <div class="container">
        <h2>Catálogo de Piezas</h2>
        <div class="toolbar">
            <input type="text" id="inputBusqueda" placeholder="Buscar por nombre o código..." style="flex:1; max-width:360px;">
            <button class="btn" id="btnBuscar" type="button">Buscar</button>
        </div>
        <table id="tablaCatalogo">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Stock</th>
                    <th>Disponibilidad</th>
                </tr>
            </thead>
            <tbody id="tbodyCatalogo">
                <tr>
                    <td>P-001</td>
                    <td>Rodamiento axial de bolas</td>
                    <td>Mecánica</td>
                    <td>12</td>
                    <td><span class="badge badge-disponible">Disponible</span></td>
                </tr>
                <tr>
                    <td>P-002</td>
                    <td>Filtro hidráulico de alta presión</td>
                    <td>Hidráulica</td>
                    <td>0</td>
                    <td><span class="badge badge-sinstock">Sin stock</span></td>
                </tr>
            </tbody>
        </table>
        <div id="mensajeSinPiezas" class="empty-state" style="display:none;">
            No se han encontrado piezas
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
