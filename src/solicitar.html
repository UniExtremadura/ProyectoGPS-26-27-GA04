<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centinela — Solicitar Pieza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🛡️ Centinela</h1>
        <nav id="navMenu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="solicitar.html" class="active">Solicitar Pieza</a>
            <a href="mis-solicitudes.html">Mis Solicitudes</a>
            <a href="almacen.html">Almacén</a>
        </nav>
    </header>
    <div class="container">
        <h2>Formulario de Solicitud de Pieza</h2>
        <div id="alertaFormulario" style="display:none;"></div>
        <form id="formSolicitud" novalidate>
            <div class="form-group">
                <label for="selectPieza">Pieza solicitada:</label>
                <select id="selectPieza">
                    <option value="">-- Seleccione una pieza --</option>
                    <option value="P-001">P-001 — Rodamiento axial de bolas</option>
                    <option value="P-002">P-002 — Filtro hidráulico de alta presión</option>
                </select>
                <div id="errorPieza" class="field-error">Debe seleccionar una pieza válida del catálogo.</div>
            </div>
            <div class="form-group">
                <label for="inputCantidad">Cantidad (mínimo 1):</label>
                <input type="number" id="inputCantidad" min="1" step="1" value="1">
                <div id="errorCantidad" class="field-error">La cantidad debe ser un número entero mayor o igual a 1.</div>
            </div>
            <div class="form-group">
                <label for="inputTarea">Tarea de mantenimiento asociada:</label>
                <input type="text" id="inputTarea" placeholder="Ej. OT-2026-104 Revisión preventiva compresor">
                <div id="errorTarea" class="field-error">Debe indicar la tarea de mantenimiento asociada.</div>
            </div>
            <button type="submit" class="btn btn-success" id="btnEnviarSolicitud">Solicitar</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
